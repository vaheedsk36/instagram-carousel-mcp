<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif"><defs><linearGradient id="bg1" x1="0.8536" y1="0.1464" x2="0.1464" y2="0.8536"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#bg1)"/><text x="96" y="126.0" fill="#38bdf8" font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="30" font-weight="700" text-anchor="start" letter-spacing="4"><tspan x="96" dy="0">WHY IT MATTERS</tspan></text><text x="96" y="182.0" fill="#f8fafc" font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="64" font-weight="800" text-anchor="start"><tspan x="96" dy="0">Speed compounds</tspan></text><rect x="96" y="226.0" width="72" height="6" rx="3" fill="#38bdf8"/><text x="96" y="312.0" fill="#f8fafc" font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="40" font-weight="400" text-anchor="start"><tspan x="96" dy="0">Every day you save shipping a feature</tspan><tspan x="96" dy="1.420em">is a day of real user feedback. Teams</tspan><tspan x="96" dy="1.420em">that ship weekly learn 4x faster than</tspan><tspan x="96" dy="1.420em">teams that ship monthly.</tspan></text><text x="96" y="1262" fill="#94a3b8" font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="30" font-weight="600">@buildnotes</text><text x="984" y="1262" fill="#94a3b8" font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="30" font-weight="600" text-anchor="end">2 / 6</text></svg>