<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif"><defs><linearGradient id="bg2" x1="0.8536" y1="0.1464" x2="0.1464" y2="0.8536"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#bg2)"/><text x="96" y="126.0" fill="#38bdf8" font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="30" font-weight="700" text-anchor="start" letter-spacing="4"><tspan x="96" dy="0">THE FRAMEWORK</tspan></text><text x="96" y="182.0" fill="#f8fafc" font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="64" font-weight="800" text-anchor="start"><tspan x="96" dy="0">The 5 moves</tspan></text><text x="96" y="290.0" fill="#38bdf8" font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="44" font-weight="800">1</text><text x="172" y="282.0" fill="#f8fafc" font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="40" font-weight="500" text-anchor="start"><tspan x="172" dy="0">Cut scope before you cut corners</tspan></text><text x="96" y="354.0" fill="#38bdf8" font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="44" font-weight="800">2</text><text x="172" y="346.0" fill="#f8fafc" font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="40" font-weight="500" text-anchor="start"><tspan x="172" dy="0">Ship behind a flag, always</tspan></text><text x="96" y="418.0" fill="#38bdf8" font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="44" font-weight="800">3</text><text x="172" y="410.0" fill="#f8fafc" font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="40" font-weight="500" text-anchor="start"><tspan x="172" dy="0">Automate the boring path to prod</tspan></text><text x="96" y="482.0" fill="#38bdf8" font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="44" font-weight="800">4</text><text x="172" y="474.0" fill="#f8fafc" font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="40" font-weight="500" text-anchor="start"><tspan x="172" dy="0">Review small, review often</tspan></text><text x="96" y="546.0" fill="#38bdf8" font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="44" font-weight="800">5</text><text x="172" y="538.0" fill="#f8fafc" font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="40" font-weight="500" text-anchor="start"><tspan x="172" dy="0">Measure, then decide</tspan></text><text x="96" y="1262" fill="#94a3b8" font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="30" font-weight="600">@buildnotes</text><text x="984" y="1262" fill="#94a3b8" font-family="'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-size="30" font-weight="600" text-anchor="end">3 / 6</text></svg>